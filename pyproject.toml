[project]
name = "heatmiserv3"
version = "3.0.1"
description = "A library to interact with Heatmiser Thermostats using V3 protocol."
authors = [{ name = "Andy Loughran", email = "andy@lockran.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "appdirs>=1.4.4,<2",
    "pyserial>=3.5,<4",
    "pyyaml>=6.0.1,<7",
    "importlib-resources>=7.1.0,<8",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/andylockran/heatmiserv3"
Documentation = "https://andylockran.github.io/heatmiserV3/"
Repository = "https://github.com/andylockran/heatmiserv3"
Issues = "https://github.com/andylockran/heatmiserv3/issues"

[dependency-groups]
test = [
    "flake8>=7.0.0,<8",
    "mock>=5.1.0,<6",
    "pytest-cov>=7.0.0,<8",
    "pytest>=9.0.3,<10",
]
docs = [
    "myst-parser>=4.0.0",
    "sphinx>=8.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.0.0",
]

[tool.uv]
default-groups = ["test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["heatmiserv3"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "/heatmiserv3",
    "/README.md",
    "/LICENSE.TXT",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["heatmiserv3"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
