# This workflow will upload a Python Package to PyPI when a release tag is pushed.

name: Upload Python Package

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv and set the Python version
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.11"
        enable-cache: true
    - name: Build Library
      run: |
        uv sync --locked
        uv build
    - name: Publish Library
      uses: pypa/gh-action-pypi-publish@release/v1
